name: E2E

on:
  push:
    branches: [main]
  pull_request:

# Deux pushes rapprochés sur une PR n'ont pas besoin de deux exécutions.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    # `supabase start` télécharge et lance une dizaine de conteneurs : c'est lui qui
    # domine la durée du job, pas la suite (~15 s).
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Avant tout le reste : ils ne demandent ni Docker ni base, ils durent quelques
      # dizaines de millisecondes, et un échec ici rend inutile de lever la stack.
      - name: Tests unitaires
        run: npm test

      - uses: supabase/setup-cli@v1
        with:
          # Alignée sur la devDependency `supabase` de package.json : avec `latest`, le
          # même commit s'exécute avec un binaire différent d'un jour à l'autre. À
          # rebumper à la main en même temps que la dépendance.
          version: 2.114.0

      # 54321-54322 tombent dans la plage de ports éphémères de Linux
      # (`net.ipv4.ip_local_port_range` = 32768-60999), où le noyau pioche AUSSI les
      # ports source des connexions sortantes. Les `docker pull` de l'étape suivante en
      # ouvrent des centaines vers ghcr.io ; qu'une seule tire 54322 et le bind de
      # `docker-proxy` échoue en « address already in use », au hasard, sur un runner
      # pourtant neuf. `ip_local_reserved_ports` ne retire ces ports QUE de l'attribution
      # automatique : un bind explicite, lui, continue de fonctionner.
      #
      # La plage couvre tout supabase/config.toml d'un coup : 54320 (shadow), 54321
      # (API), 54322 (db), 54323 (Studio), 54324 (SMTP), 54327 (analytics), 54329
      # (pooler). Le 5173 de Vite est sous 32768, donc déjà hors de portée.
      - name: Réserver les ports de la stack locale
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329

      # Applique les migrations ET supabase/seed.sql (la clé de chiffrement de dev) —
      # sans elle, aucune vue déchiffrante ne répond.
      #
      # Les services exclus ne servent à aucun test : c'est le levier le plus rentable
      # sur la durée du job. `realtime` est délibérément CONSERVÉ — il coûte peu et
      # évite une surprise le jour où un test touchera un écran qui s'y abonne.
      - name: Démarrer la stack Supabase locale
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit

      # ~150 Mo de navigateur, sinon retéléchargés à chaque exécution.
      - name: Cache des navigateurs Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Chromium seul : les deux projets (desktop et mobile) l'utilisent.
      # `--with-deps` installe les librairies système ; son oubli produit une erreur
      # illisible au premier lancement.
      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      # `!cancelled()` et non `failure()` : le rapport d'une exécution verte sert aussi,
      # ne serait-ce qu'à voir les durées.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
