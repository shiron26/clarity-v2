/* ============================================================
   TOKENS — recopiés à l'identique du @theme de src/index.css
   ============================================================ */
:root{
  --canvas:#f7f6f3; --surface:#fff; --surface-sidebar:#fdfdfb; --surface-subtle:#f2f1ec;
  --field:#ecebe6; --auth-canvas:#faf9f6;
  --night:#17181f; --night-soft:#212229; --night-line:#2a2b33;
  --ink:#17181f; --ink-2:#4a4b55; --ink-3:#6d6e78; --ink-muted:#9a9aa6; --ink-faint:#8b8b93;
  --ink-onnight:#7c8097; --placeholder:#a5a5ad;
  --primary:#1a66ff; --primary-hover:#0f4fd6; --primary-active:#0b3fae; --primary-soft:#e6ecff;
  --link:#4a7aff; --link-hover:#8aa8ff;
  --accent:#e8590c; --accent-bg:#fdf3e4; --danger:#d6431f; --danger-bg:#fdeadb;
  --success:#00b862; --warn:#e8a80c;
  --border:#ecebe6; --border-strong:#dcdbd4; --border-ok:#8fe0b6; --border-ko:#f3b9a4; --border-idle:#d8d7d0;

  --r-xs:6px; --r-sm:9px; --r-md:10px; --r-lg:12px; --r-panel:14px; --r-xl:16px; --r-2xl:20px; --r-3xl:26px;
  --t-micro:9px; --t-caption:10.5px; --t-label:11.5px; --t-body:12.5px; --t-ui:13.5px;
  --t-card:14.5px; --t-title:17px; --t-h1:20px; --t-display:29px;

  --sh-card:0 1px 3px rgb(23 24 31/.04),0 10px 30px rgb(23 24 31/.05);
  --sh-modal:0 30px 80px rgb(0 0 0/.35);
  --sh-dropdown:0 14px 36px rgb(0 0 0/.14);
  --sh-primary:0 4px 14px rgb(26 102 255/.28);
  --sh-primary-hover:0 8px 22px rgb(15 79 214/.34);
  --sh-fab:0 10px 28px rgb(26 102 255/.35);
  --brand-gradient:linear-gradient(150deg,#0044e0,#1a66ff 55%,#2f8bff);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:#e9e8e3; color:var(--ink);
  font-family:'Sora Variable',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}

/* ============================================================
   CHROME DE LA PLANCHE (volontairement hors design system)
   ============================================================ */
.chrome{position:sticky;top:0;z-index:100;background:#0e0f14;color:#fff;
  box-shadow:0 6px 24px rgb(0 0 0/.22)}
.chrome-row{display:flex;align-items:center;gap:18px;padding:11px 22px;flex-wrap:wrap}
.chrome-row+.chrome-row{border-top:1px solid #232532}
.chrome-title{font-size:13px;font-weight:600;letter-spacing:.2px;white-space:nowrap}
.chrome-title span{color:#6f7385;font-weight:400;margin-left:8px;font-size:11.5px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{appearance:none;border:0;background:transparent;color:#8f93a6;cursor:pointer;
  font-size:12px;font-weight:500;padding:6px 13px;border-radius:8px;transition:.14s;white-space:nowrap}
.tab:hover{color:#fff;background:#1c1e28}
.tab[aria-selected="true"]{background:#1a66ff;color:#fff}
.tabs.sub .tab[aria-selected="true"]{background:#252836;color:#fff;box-shadow:inset 0 0 0 1px #3a3e51}
.spacer{margin-left:auto}
.vp{display:flex;gap:3px;background:#1c1e28;padding:3px;border-radius:9px}
.vp button{appearance:none;border:0;background:transparent;color:#8f93a6;cursor:pointer;
  font-size:11px;font-weight:500;padding:5px 11px;border-radius:6px;transition:.14s}
.vp button[aria-pressed="true"]{background:#33374a;color:#fff}
.note{font-size:11.5px;color:#63656f;line-height:1.65;max-width:880px;padding:14px 22px 4px;margin:0}
.note b{color:#1c1d24;font-weight:600}
.note i{color:#63656f}

/* ============================================================
   SCÈNE + CADRES D'APPAREIL
   ============================================================ */
.stage{display:flex;gap:34px;align-items:flex-start;padding:34px 22px 80px;overflow-x:auto}
.frame-wrap{flex:none}
.frame-cap{font-size:10px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;
  color:#8d8b83;margin:0 0 9px 4px}

.mobile{width:390px;height:844px;border-radius:40px;background:var(--canvas);
  overflow:hidden;position:relative;display:flex;flex-direction:column;
  box-shadow:0 0 0 9px #14151b,0 0 0 10px #33343d,0 30px 70px rgb(0 0 0/.3)}
.desktop{width:1280px;height:820px;border-radius:14px;background:var(--canvas);
  overflow:hidden;display:flex;box-shadow:0 24px 64px rgb(0 0 0/.26);
  transform-origin:top left}
.desktop-box{overflow:hidden}

.scroll{overflow-y:auto;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{width:7px}
.scroll::-webkit-scrollbar-thumb{background:#d6d5cd;border-radius:4px}
.scroll::-webkit-scrollbar-track{background:transparent}

/* ============================================================
   COQUILLE APPLICATIVE
   ============================================================ */
.sidebar{width:228px;flex:none;display:flex;flex-direction:column;gap:2px;
  border-right:1px solid var(--border);background:var(--surface-sidebar);
  padding:22px 14px 18px}
.logo{display:inline-flex;align-items:center;gap:10px}
.logo .mark{display:flex;align-items:center;justify-content:center;background:var(--brand-gradient);
  color:#fff;border-radius:var(--r-sm);width:28px;height:28px;font-size:12px}
.logo .word{font-weight:600;font-size:16px}
.navitem{display:flex;align-items:center;gap:10px;border-radius:var(--r-md);
  padding:10px 12px;font-size:var(--t-ui);color:var(--ink-3);cursor:pointer;transition:.15s}
.navitem:hover{background:var(--surface-subtle);color:var(--ink)}
.navitem.on{background:var(--primary-soft);color:var(--primary);font-weight:500}
.navitem .ic{width:16px;height:16px;flex:none}
.navitem .badge{margin-left:auto;background:var(--primary);color:#fff;font-size:var(--t-caption);
  font-weight:700;border-radius:var(--r-2xl);padding:2px 8px}
.sidefoot{margin-top:14px;display:flex;align-items:center;gap:10px;
  border-top:1px solid var(--border);padding:14px 8px 0}
.avatar{width:32px;height:32px;flex:none;border-radius:50%;background:var(--brand-gradient);
  color:#fff;font-weight:700;font-size:var(--t-body);display:flex;align-items:center;justify-content:center}

.pane{flex:1;min-width:0;display:flex;flex-direction:column}
.main-d{flex:1;min-height:0;overflow-y:auto;padding:28px 32px}
.main-m{flex:1;min-height:0;overflow-y:auto;padding:20px}

.topbar-m{flex:none;display:flex;align-items:center;gap:10px;padding:34px 20px 12px}
.tabbar-m{flex:none;border-top:1px solid var(--border);background:var(--surface-sidebar);
  padding:10px 10px 20px;display:grid;grid-template-columns:1fr 1fr 60px 1fr 1fr;align-items:center}
.tabbar-m .t{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  min-height:44px;font-size:11px;font-weight:500;color:var(--ink-muted)}
.tabbar-m .t.on{color:var(--primary);font-weight:600}
.fab{position:relative;top:-22px;justify-self:center;width:54px;height:54px;border-radius:50%;
  background:var(--brand-gradient);color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:var(--sh-fab);border:0;cursor:pointer}

/* ============================================================
   PRIMITIVES (Button, Card, Field, Badge…)
   ============================================================ */
.card{background:var(--surface);border-radius:var(--r-2xl);padding:20px;box-shadow:var(--sh-card)}
.card.flush{padding:0;overflow:hidden}
.night{background:var(--night);border-radius:var(--r-2xl);padding:20px 22px;color:#fff}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  font-weight:500;border:0;transition:background-color .15s,box-shadow .15s,transform .09s,border-color .15s;
  font-size:var(--t-body);padding:9px 16px;border-radius:var(--r-md)}
.btn:focus-visible{outline:none;box-shadow:0 0 0 3px rgb(26 102 255/.32)}
.btn-primary{background:var(--primary);color:#fff;box-shadow:var(--sh-primary)}
.btn-primary:hover{background:var(--primary-hover);box-shadow:var(--sh-primary-hover);transform:translateY(-1px)}
.btn-primary:active{background:var(--primary-active);transform:translateY(1px)}
.btn-secondary{background:var(--surface);color:var(--ink-2);border:1.5px solid var(--border)}
.btn-secondary:hover{border-color:var(--border-strong)}
.btn-ghost{background:transparent;color:var(--ink-3)}
.btn-ghost:hover{background:var(--surface-subtle);color:var(--ink)}
.btn-lg{font-size:var(--t-ui);padding:14px 18px;border-radius:var(--r-lg)}
.btn-sm{font-size:var(--t-body);padding:6px 12px;border-radius:var(--r-sm)}
.btn-block{width:100%}
.btn[disabled]{background:var(--field);color:var(--ink-muted);box-shadow:none;cursor:default;transform:none}

.input{width:100%;border-radius:var(--r-lg);border:1.5px solid var(--border);background:var(--surface);
  padding:14px 16px;font-size:var(--t-ui);color:var(--ink);font-family:inherit;transition:.15s}
.input::placeholder{color:var(--placeholder)}
.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgb(26 102 255/.14)}
/* select natif : c'est un vrai contrôle de formulaire, et sur mobile il donne
   le sélecteur système — bien meilleur qu'un menu maison */
.selectwrap{position:relative;display:inline-block;flex:none}
.select{appearance:none;-webkit-appearance:none;font-family:inherit;cursor:pointer;
  border-radius:var(--r-lg);border:1.5px solid var(--border);background:var(--surface);
  padding:14px 34px 14px 16px;font-size:var(--t-ui);color:var(--ink);transition:.15s;min-width:104px}
.select:hover{border-color:var(--border-strong)}
.select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgb(26 102 255/.14)}
.selectwrap .chev{position:absolute;right:13px;top:50%;transform:translateY(-50%);
  font-size:11px;color:var(--ink-muted);pointer-events:none}

/* l'unité choisie se répète en suffixe fixe, jamais retapée par l'utilisateur */
.unitfield{position:relative;display:inline-block}
.unitfield input{padding-right:56px}
.unitfield .u{position:absolute;right:16px;top:50%;transform:translateY(-50%);
  font-size:var(--t-ui);color:var(--ink-3);pointer-events:none}
.unitfield .u:empty{display:none}

.flabel{font-size:var(--t-label);font-weight:500;color:var(--ink-2);display:block;margin-bottom:7px}
.fhint{font-size:11px;color:var(--ink-muted);margin-top:7px;line-height:1.5}

.seclabel{font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--ink-muted);margin:0 0 12px}
.seclabel.on-night{color:var(--ink-onnight)}
.h1{font-size:var(--t-h1);font-weight:600;margin:0}
.h1-m{font-size:22px;font-weight:500;margin:0}
.h2{font-size:var(--t-card);font-weight:600;margin:0}
.muted{color:var(--ink-muted)}
.ink2{color:var(--ink-2)}
.ink3{color:var(--ink-3)}
.tiny{font-size:11px;line-height:1.55}
.body{font-size:var(--t-body);line-height:1.6}
.link{color:var(--primary);font-weight:500;font-size:var(--t-label);cursor:pointer;text-decoration:none}
.link:hover{color:var(--primary-hover)}

.badge{display:inline-flex;align-items:center;border-radius:var(--r-2xl);padding:2px 9px;
  font-size:var(--t-micro);font-weight:600;white-space:nowrap}
.badge.neutral{background:var(--field);color:var(--ink-2)}
.badge.primary{background:var(--primary);color:#fff}
.badge.accent{background:var(--accent-bg);color:var(--accent)}
.badge.onDark{background:rgb(255 255 255/.22);color:#fff}
.badge.soft{background:var(--primary-soft);color:var(--primary)}
.metabadge{display:inline-flex;align-items:center;border:1px solid var(--border);background:var(--field);
  border-radius:var(--r-2xl);padding:3px 10px;font-size:10.5px;color:var(--ink-2);font-weight:500}

.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* stepper d'année — un segmented control ne tient pas au bout de dix ans */
.ystep{display:inline-flex;align-items:center;gap:14px}
.yarr{width:30px;height:30px;border:0;background:transparent;cursor:pointer;font-size:13px;
  color:var(--ink-2);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;
  transition:.15s;font-family:inherit}
.yarr:hover{background:var(--surface-subtle)}
.yarr[disabled]{color:var(--border-strong);cursor:default;background:transparent}
.yval{font-size:var(--t-h1);font-weight:600;letter-spacing:.3px;min-width:58px;text-align:center}

.seg{display:inline-flex;gap:3px;background:var(--field);padding:4px;border-radius:var(--r-lg)}
.seg button{appearance:none;border:0;background:transparent;cursor:pointer;border-radius:var(--r-sm);
  padding:8px 12px;font-size:var(--t-label);font-weight:500;color:var(--ink-3);transition:.15s;font-family:inherit}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;
  box-shadow:0 2px 5px rgb(0 0 0/.1)}

.chip{border-radius:var(--r-2xl);padding:7px 15px;font-size:13px;color:var(--ink-3);cursor:pointer;
  border:0;background:transparent;font-family:inherit;transition:.15s}
.chip:hover{color:var(--ink)}
.chip.on{background:var(--primary-soft);color:var(--primary);font-weight:600}

.dashed{border:1.5px dashed var(--border-strong);border-radius:var(--r-2xl);background:var(--surface-sidebar)}

/* ============================================================
   COMPOSANTS MÉTIER
   ============================================================ */
/* ============================================================
   DECK — le plein écran des reviews : fond sombre, contenu centré,
   une idée par écran, barre de progression en bas. Presque pas de texte :
   les justifications produit vivent dans les annotations, pas dans l'UI.
   ============================================================ */
.deck{flex:1;min-height:0;display:flex;flex-direction:column;color:#fff;
  background:radial-gradient(130% 55% at 50% 0%,#24262f 0%,#0e0f15 58%,#0b0c11 100%)}
.deckbody{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:44px 24px}
.deckbody > .wrap-in{width:100%;max-width:430px;display:flex;flex-direction:column;align-items:center}
.deckfoot{flex:none;display:flex;align-items:center;justify-content:center;gap:26px;
  padding:18px 24px calc(24px + env(safe-area-inset-bottom))}

.dkick{font-size:12.5px;font-weight:600;letter-spacing:2.2px;text-transform:uppercase;
  color:#6f7385;margin:0 0 20px}
.dnum{font-size:104px;font-weight:700;line-height:.92;margin:0 0 14px;letter-spacing:-2px;
  background:linear-gradient(180deg,#5b8cff 0%,#3f7dff 45%,#4aa8ff 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.dhead{font-size:22px;font-weight:600;color:#fff;margin:0;line-height:1.3}
.dsub{font-size:14px;color:#8b8e9e;margin:10px 0 0;line-height:1.5}
.dbtn{margin-top:36px;background:#2b5cff;color:#fff;border:0;border-radius:14px;
  padding:15px 30px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;
  box-shadow:0 0 34px rgb(43 92 255/.45);transition:background-color .15s,box-shadow .15s}
.dbtn:hover{background:#1f4ce8;box-shadow:0 0 46px rgb(43 92 255/.62)}
.dlink{margin-top:18px;background:none;border:0;color:#8b8e9e;font-size:13.5px;
  cursor:pointer;font-family:inherit;padding:6px}
.dlink:hover{color:#c8cad6}
.dcard{width:100%;background:#191b23;border:1px solid #262833;border-radius:16px;
  padding:16px 18px;text-align:left}
.dchip{margin-top:13px;background:transparent;border:1.5px solid #2e3039;border-radius:20px;
  padding:6px 13px;font-size:12px;font-weight:600;color:#8b8e9e;cursor:pointer;font-family:inherit;
  transition:.15s}
.dchip:hover{border-color:#4a7aff;color:#7ca0ff}
.dchip.on{border-color:#2b5cff;background:rgb(43 92 255/.16);color:#7ca0ff}

.dquit{font-size:13.5px;color:#8b8e9e;cursor:pointer}
.ddot{width:8px;height:8px;border-radius:4px;background:#33353f;display:inline-block;transition:.2s}
.ddot.on{width:26px;background:#2b5cff}
.dwarn{color:#f5a524;font-weight:600}
.dok{color:#3ff5a2;font-weight:600}
.dpip{width:26px;height:26px;border-radius:50%;background:#24262f;flex:none}
.dinput{width:100%;background:transparent;border:0;border-bottom:1px solid #2e3039;
  color:#fff;font-family:inherit;font-size:17px;padding:10px 0;outline:none}
.dinput::placeholder{color:#5a5d6b}
.drk{background:none;border:0;cursor:pointer;font-family:inherit;padding:6px 10px;
  display:flex;flex-direction:column;align-items:center;gap:7px;border-radius:12px;transition:.15s}
.drk:hover{background:#191b23}
.drk .lbl{font-size:14px;font-weight:600;color:#6f7385}
.drk .sub{font-size:11.5px;color:#565a68}
.drk.on .lbl{color:#f5a524}
.drk.on .sub{color:#8b8e9e}

/* — carte objectif (gradient de slot, désaturée si non avancée) — */
.objcard{position:relative;overflow:hidden;border-radius:var(--r-2xl);padding:18px;color:#fff;
  display:flex;flex-direction:column;transition:filter .8s cubic-bezier(.22,1,.36,1)}
.objcard.dim{filter:grayscale(1) brightness(.94) saturate(0) contrast(.94) opacity(.72)}
.objcard .title{font-size:15.5px;font-weight:600;line-height:1.2}
.objcard .sub{font-size:11px;color:rgb(255 255 255/.72);margin-top:3px}
.objcard .viz{margin-top:10px;height:82px;display:flex;align-items:center;gap:14px}

/* la carte reprend vie quand une séance est cochée : cardPop + colorReveal,
   exactement les keyframes de src/index.css */
@keyframes cardPop{0%{scale:1}35%{scale:1.035}65%{scale:.99}100%{scale:1}}
@keyframes colorReveal{
  0%{filter:grayscale(1) brightness(.94) saturate(0) contrast(.94) opacity(.72)}
  60%{filter:grayscale(0) brightness(1.12) saturate(1.25) opacity(1)}
  100%{filter:none}}
.objcard.lit{animation:cardPop .7s cubic-bezier(.34,1.56,.64,1),colorReveal 1.25s cubic-bezier(.22,1,.36,1)}

/* encart sombre — le motif de la review actuelle : le bleu reste à l'action seule */
.nightbanner{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  background:var(--night);border-radius:var(--r-2xl);padding:18px 20px;color:#fff}
.nightbanner .t{font-size:var(--t-card);font-weight:600}
.nightbanner .m{font-size:var(--t-label);color:var(--ink-onnight);margin-top:4px}

/* — anneau de cadence : conic-gradient, un segment par séance — */
.ring{display:flex;align-items:center;justify-content:center;border-radius:50%;flex:none}
.ring .core{display:flex;align-items:center;justify-content:center;border-radius:50%;font-weight:600;color:#fff}
.ring .core small{color:rgb(255 255 255/.65)}

/* — jetons de jour (cadence quotidienne / bandeau semaine) — */
.daytok{display:flex;align-items:center;justify-content:center;border-radius:50%;flex:none;
  font-weight:600;line-height:1}
.daytok.done{background:#fff}
.daytok.today{border:1.5px solid #fff;color:#fff;animation:cellPulse 1.8s ease-in-out infinite}
.daytok.miss{border:1.5px dashed rgb(255 255 255/.55);color:rgb(255 255 255/.7)}
.daytok.future{border:1px solid rgb(255 255 255/.4);color:rgb(255 255 255/.6)}
.daytok.nodata{border:1px solid rgb(255 255 255/.18);color:rgb(255 255 255/.35)}
@keyframes cellPulse{0%,100%{opacity:1}50%{opacity:.45}}

/* — heatmap : une colonne = une semaine, 7 cases L→D — */
.heat{display:flex;gap:3px}
.heat .labels{display:flex;flex-direction:column;padding:4.5px 2px 0 0;flex:none}
.heat .labels span{height:15px;line-height:15px;margin-bottom:3.5px;font-size:8.5px;color:#565866;text-align:center}
.heat .cols{display:flex;gap:3px}
.heat .colw{display:flex;flex-direction:column;gap:3.5px;border-radius:8px;padding:3.5px;
  border:1px solid transparent;flex:none}
.heat .cell{width:15px;height:15px;border-radius:4px;flex:none}
.heat .cell.nodata{background:#20212c}
.heat .cell.miss{background:#20212c;box-shadow:inset 0 0 0 1px rgb(255 255 255/.13)}
.heat .cell.future{background:#1b1c24;border:1px solid #262734}
.heat .cell.pulse{animation:cellPulse 1.8s ease-in-out infinite}
.heat .months{position:relative;height:11px;margin-bottom:4px}
.heat .months span{position:absolute;top:0;font-size:8.5px;line-height:11px;color:#565866;white-space:nowrap}

/* — légende heatmap — */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:10px;color:var(--ink-onnight)}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;vertical-align:-1px;margin-right:5px}

/* — ligne de tâche (liseré gauche coloré si reliée à un objectif) — */
.taskrow{display:flex;align-items:center;gap:13px;padding:13px 10px 13px 17px;
  border-bottom:1px solid var(--surface-subtle)}
.taskrow:last-child{border-bottom:0}
.taskrow.linked{border-left:3px solid;padding-left:14px}
.taskrow .tt{font-size:var(--t-ui);color:var(--ink)}
.taskrow.done .tt{color:var(--ink-muted);text-decoration:line-through}

.cb{width:21px;height:21px;flex:none;border-radius:var(--r-sm);border:2px solid var(--border-idle);
  background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background-color .15s,border-color .15s;padding:0}
.cb.on{border-color:transparent}
.cb svg{opacity:0;width:10px;height:10px}
.cb.on svg{opacity:1}
.cb.pop{animation:cbPop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes cbPop{0%{scale:1}40%{scale:1.4}70%{scale:.88}100%{scale:1}}

.listpill{display:inline-flex;align-items:center;gap:6px;border-radius:var(--r-2xl);
  border:1px solid var(--border);background:var(--surface);padding:2px 10px;
  font-size:9.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.listpill i{width:5px;height:5px;border-radius:50%;display:inline-block}

/* — barre de quantité + sparkline — */
.qbar{height:9px;border-radius:var(--r-xs);background:var(--field);overflow:hidden}
.qbar i{display:block;height:100%;border-radius:var(--r-xs)}

/* — régularité glissante : arc + cumul — */
.regu{display:flex;align-items:center;gap:16px}
.regu .num{font-size:26px;font-weight:600;line-height:1}
.regu .lbl{font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-onnight)}

/* — frise annuelle — */
.frise{display:flex;flex-direction:column;gap:9px}
.friserow{display:flex;align-items:center;gap:14px}
.friselab{width:172px;flex:none;font-size:var(--t-label);color:#d5d6e0;font-weight:500;
  display:flex;align-items:center;gap:8px;overflow:hidden}
.friselab i{width:7px;height:7px;border-radius:50%;flex:none}
.friselab s{text-decoration:none;color:#6a6d80;font-weight:400;font-size:10px;flex:none}
.frisetrack{position:relative;flex:1;height:26px;border-radius:7px;background:#1d1e27}
.frisebar{position:absolute;top:0;bottom:0;border-radius:7px;overflow:hidden;display:flex;gap:1.5px;
  padding:3px;align-items:stretch}
.frisebar .wk{flex:1;border-radius:2px;min-width:1px}
.frisebar.ghost{border:1px dashed #3a3c4d;background:transparent}
.frisebar.stopped{border-right:2px dashed rgb(255 255 255/.35)}
.frisegrid{position:absolute;inset:0;display:flex;pointer-events:none}
.frisegrid i{flex:1;border-right:1px solid #24252f}
.frisegrid i:nth-child(3n){border-right-color:#32343f}
.frisegrid i:last-child{border-right:0}
.frisenow{position:absolute;top:-6px;bottom:-6px;width:1.5px;background:#ff9f43;border-radius:1px}
.frisemonths{display:flex;font-size:9px;color:#5c5f70;letter-spacing:.6px}
.frisemonths i{flex:1;text-align:center;font-style:normal}
.frisequarters{display:flex;font-size:9px;color:#7c8097;font-weight:600;letter-spacing:1px}
.frisequarters i{flex:1;text-align:center;font-style:normal}

/* — étapes onboarding — */
.steps{display:flex;gap:5px;margin-bottom:26px}
.steps i{height:3px;flex:1;border-radius:2px;background:var(--field)}
.steps i.on{background:var(--primary)}
.steps i.past{background:var(--primary-soft)}

.optcard{display:block;width:100%;text-align:left;border-radius:var(--r-panel);
  border:1.5px solid var(--border);background:var(--surface);padding:15px 16px;cursor:pointer;
  transition:.15s;font-family:inherit}
.optcard:hover{border-color:#a9beff;background:#fbfcff}
.optcard.on{border-color:var(--primary);background:var(--primary-soft)}
.optcard .ot{font-size:var(--t-ui);font-weight:600;color:var(--ink)}
.optcard .od{font-size:11px;color:var(--ink-muted);line-height:1.55;margin-top:4px}

/* — bandes de l'écran objectif — */
.band{padding:18px 22px}
.band+.band{border-top:1px solid var(--surface-subtle)}
.band.field-bg{background:var(--field);border-top-color:var(--border-strong)}
.band.night-bg{background:var(--night);color:#fff;border-top:0}
.band.ok-bg{background:#eef8f0}

.milestone{display:flex;align-items:center;gap:11px;padding:9px 0}
.mcb{width:18px;height:18px;flex:none;border-radius:var(--r-xs);border:2px solid var(--border-idle);
  display:flex;align-items:center;justify-content:center}

/* — rituel — */
.ritual-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px}
.rstep{font-size:10px;font-weight:600;letter-spacing:1.3px;text-transform:uppercase;color:var(--ink-muted)}
.triage{display:flex;gap:6px}
.triage button{flex:1;font-size:11px;font-weight:500;padding:8px 6px;border-radius:var(--r-sm);
  border:1.5px solid var(--border);background:var(--surface);color:var(--ink-2);cursor:pointer;
  font-family:inherit;transition:.15s}
.triage button:hover{border-color:var(--border-strong);background:var(--canvas)}
.triage button.picked{border-color:var(--primary);background:var(--primary-soft);color:var(--primary);font-weight:600}

/* « Emporter » est une sélection, pas une complétion : jamais de case ronde ici */
.carry{display:inline-flex;align-items:center;gap:6px;flex:none;border-radius:var(--r-2xl);
  padding:6px 13px;font-size:11.5px;font-weight:600;cursor:pointer;font-family:inherit;
  border:1.5px solid var(--border);background:var(--surface);color:var(--ink-3);transition:.15s}
.carry:hover{border-color:#a9beff;color:var(--primary)}
.carry.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}

/* fusées 1-3 et verdict atteint / pas atteint (bilan de trimestre) */
.rk{border:0;background:transparent;padding:4px;cursor:pointer;border-radius:var(--r-xs);
  transition:transform .12s;line-height:0}
.rk:hover{transform:translateY(-2px)}
.verdict{flex:1;border-radius:var(--r-sm);border:1.5px solid var(--border);background:var(--surface);
  color:var(--ink-2);font-size:var(--t-body);font-weight:500;padding:10px 8px;cursor:pointer;
  font-family:inherit;transition:.15s}
.verdict:hover{border-color:var(--border-strong);background:var(--canvas)}
.verdict.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary);font-weight:600}

.projrow{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid var(--surface-subtle)}
.projrow:last-child{border-bottom:0}

/* — bannière rituel — */
.ribbon{display:flex;align-items:center;gap:14px;border-radius:var(--r-2xl);padding:16px 18px;
  background:var(--brand-gradient);color:#fff;box-shadow:var(--sh-primary)}
.ribbon .btn{background:rgb(255 255 255/.2);color:#fff;box-shadow:none;flex:none}
.ribbon .btn:hover{background:rgb(255 255 255/.3);transform:none}

.calm{padding:26px 20px;text-align:center}
.calm p{margin:0}

<body>

<div class="chrome">
  <div class="chrome-row">
    <div class="chrome-title">Clarity — refonte <span>maquettes · août 2026</span></div>
    <div class="tabs" id="screenTabs"></div>
    <div class="spacer"></div>
    <div class="vp" id="vpToggle">
      <button data-vp="both" aria-pressed="true">Côte à côte</button>

    </div>
  </div>
  <div class="chrome-row">
    <div class="tabs sub" id="stateTabs"></div>
  </div>
</div>

<p class="note" id="stateNote"></p>
<div class="stage" id="stage"></div>

<script>
/* ============================================================
   DONNÉES DE MAQUETTE
   Ancre : dimanche 16 août 2026 · semaine ISO 33 (10 → 16 août) · T3
   ============================================================ */
const SKINS = {
  1:{grad:'linear-gradient(150deg,#1420ff 0%,#0f62ff 48%,#00c2ff 100%)',core:'#0f55ff',hue:'#00a3ff',
     shadow:'0 12px 30px rgb(15 98 255 / .32)',ramp:['#2f7bff','#00a3ff','#00c6ff','#22dcff','#5ceaff','#9df4ff']},
  2:{grad:'linear-gradient(150deg,#5b00f5 0%,#8318ff 55%,#c44dff 100%)',core:'#7d0fff',hue:'#b44dff',
     shadow:'0 12px 30px rgb(131 24 255 / .32)',ramp:['#a02bff','#b44dff','#c76aff','#d98aff','#e9adff','#f6d2ff']},
  3:{grad:'linear-gradient(150deg,#009e54 0%,#00c46a 52%,#2aeb8d 100%)',core:'#00b862',hue:'#0fe888',
     shadow:'0 12px 30px rgb(0 196 106 / .3)',ramp:['#00d474','#0fe888','#3ff5a2','#6ffbba','#9dffcf','#ccffe6']},
};
/* Les secondaires n'ont pas d'identité propre : un gris partagé, comme dans
   ObjectivePicker aujourd'hui. C'est le signal « discret » le plus fort — on ne
   retient pas leur couleur parce qu'on n'est pas censé les surveiller. */
const SEC_SKIN = {grad:'linear-gradient(150deg,#3f414d,#5a5c6b)', core:'#5a5c6b', hue:'#8b8e9e',
  shadow:'0 8px 20px rgb(63 65 77 / .22)',
  ramp:['#6b6e80','#7c8093','#8d91a5','#9ea2b8','#afb4ca','#c0c5dd']};
const skinOf = o => o && o.sec ? SEC_SKIN : SKINS[(o && o.slot) || 1];

const LIST_PALETTE = ['#8f9bde','#1a66ff','#00a3d9','#5c5cff','#00b862','#e8590c','#f5a524','#d6431f'];
const DAYS = ['L','M','M','J','V','S','D'];

const ICONS = {
  dash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"/></svg>',
  tasks:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h8"/><path d="M3 6l1.4 1.4L7 4.8"/><path d="M3 12l1.4 1.4L7 10.8"/><circle cx="4.5" cy="18" r="1.6"/></svg>',
  obj:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></svg>',
  year:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  review:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16l5-5 4 4 7-8"/><path d="M15 6.5h5v5"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v2.2M12 19.3v2.2M21.5 12h-2.2M4.7 12H2.5M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6M18.7 18.7l-1.6-1.6M6.9 6.9L5.3 5.3"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5 9.5 17.5 19.5 6.5"/></svg>',
  repeat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9a5 5 0 0 1 5-5h9"/><path d="M15 1.5 18.5 4 15 6.5"/><path d="M20 15a5 5 0 0 1-5 5H6"/><path d="M9 22.5 5.5 20 9 17.5"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
};
const ic = (n, cls) => ICONS[n].replace('<svg', '<svg class="' + (cls || '') + '"');

/* ============================================================
   HELPERS DE RENDU
   ============================================================ */
const NAV = [
  {id:'dashboard', label:'Dashboard', icon:'dash'},
  {id:'taches',    label:'Tâches',    icon:'tasks', badge:2},
  {id:'objectif',  label:'Objectifs', icon:'obj'},
  {id:'annee',     label:'Année',     icon:'year'},
  {id:'rituel',    label:'Rituel',    icon:'review'},
];

function sidebar(active){
  return `<nav class="sidebar">
    <div class="logo" style="padding:0 10px 18px"><span class="mark">▲</span><span class="word">Clarity</span></div>
    ${NAV.map(n=>`<div class="navitem ${n.id===active?'on':''}">
        ${ic(n.icon,'ic')}<span>${n.label}</span>
        ${n.badge?`<span class="badge">${n.badge}</span>`:''}
      </div>`).join('')}
    <div style="margin-top:auto"></div>
    <div class="navitem" style="color:var(--ink-muted)">${ic('gear','ic')}<span>Réglages</span></div>
    <div class="sidefoot">
      <div class="avatar">C</div>
      <div class="grow"><div style="font-size:var(--t-body);font-weight:600" class="trunc">Camille Durand</div>
      <div style="font-size:10px" class="muted">Espace personnel</div></div>
    </div>
  </nav>`;
}
function topbarM(){
  return `<header class="topbar-m">
    <div class="logo"><span class="mark">▲</span><span class="word">Clarity</span></div>
    <div style="margin-left:auto" class="row"><div class="avatar" style="width:34px;height:34px">C</div></div>
  </header>`;
}
function tabbarM(active){
  const t = (n) => `<div class="t ${n.id===active?'on':''}">${ic(n.icon,'')?'':''}<span style="width:19px;height:19px;display:block">${ic(n.icon,'')}</span><span>${n.label}</span></div>`;
  return `<nav class="tabbar-m">
    ${t(NAV[0])}${t(NAV[1])}
    <button class="fab">${ic('plus','')}</button>
    ${t(NAV[2])}${t(NAV[4])}
  </nav>`;
}
/* coquille : desktop = sidebar + main · mobile = topbar + main + tabbar */
function shell(mode, active, inner){
  if(mode==='desktop'){
    return `<div class="desktop">${sidebar(active)}<div class="pane"><div class="main-d scroll">${inner}</div></div></div>`;
  }
  return `<div class="mobile">${topbarM()}<div class="main-m scroll">${inner}</div>${tabbarM(active)}</div>`;
}
/* Un « deck » = un écran de cérémonie. Contrat volontairement étroit :
   un sur-titre, un contenu, une action. Pas de paragraphe explicatif. */
function deck(mode, o){
  const cls = mode==='desktop' ? 'desktop' : 'mobile';
  const dots = o.total ? Array.from({length:o.total},(_,i)=>
    `<span class="ddot ${i+1===o.step?'on':''}"></span>`).join('') : '';
  return `<div class="${cls}" style="background:#0b0c11">
    <div class="deck">
      <div class="deckbody"><div class="wrap-in">
        ${o.kicker?`<p class="dkick">${o.kicker}</p>`:''}
        ${o.body}
        ${o.cta?`<button class="dbtn">${o.cta}</button>`:''}
        ${o.link?`<button class="dlink">${o.link}</button>`:''}
      </div></div>
      <div class="deckfoot">
        <span class="dquit">← Quitter</span>
        ${dots?`<span class="row" style="gap:7px">${dots}</span>`:''}
      </div>
    </div></div>`;
}

/* plein écran sans padding : permet un bandeau nuit à fond perdu */

/* plein écran (onboarding, rituel) : pas de coquille de nav */
function bare(mode, inner, bg){
  const style = bg ? `background:${bg}` : '';
  if(mode==='desktop') return `<div class="desktop" style="${style}"><div class="pane"><div class="main-d scroll" style="display:flex;align-items:flex-start;justify-content:center;padding:60px 32px">${inner}</div></div></div>`;
  return `<div class="mobile" style="${style}"><div class="main-m scroll" style="padding:38px 22px 30px">${inner}</div></div>`;
}

/* — anneau de cadence (conic-gradient, un segment par séance attendue) — */
function ring(done, target, core, size){
  const seg = 360/target, gap = 6;
  const stops = [];
  for(let i=0;i<target;i++){
    const c = i<done ? '#fff' : 'rgba(255,255,255,.3)';
    const s = i*seg, e = (i+1)*seg;
    stops.push(`${c} ${s}deg ${e-gap}deg,transparent ${e-gap}deg ${e}deg`);
  }
  const inner = Math.round(size*0.65), large = size>60;
  return `<div class="ring" style="width:${size}px;height:${size}px;background:conic-gradient(from -90deg,${stops.join(',')})">
    <div class="core" style="background:${core};width:${inner}px;height:${inner}px;font-size:${large?16:12}px">
      <span data-ringdone="${done+1}" data-ringpending="${done}">${done}</span><small style="font-size:${large?11:9}px">/${target}</small></div></div>`;
}

/* — jetons de jour — */

/* — heatmap : colonnes = semaines · cellules = jours (4 états distincts) — */
function heatmap(opts){
  const {weeks, slot, showLabels=true, months=[], cell=15} = opts;
  const pad = 3.5, gap = 3.5, colGap = 3;
  const skin = SKINS[slot];
  let run = 0;
  const cols = weeks.map(w=>{
    if(w.past && w.held) run++; else if(w.past && !w.held) run = 0;
    const heat = skin.ramp[Math.max(0,Math.min(5,run-1))];
    return {...w, heat: run>0 ? heat : skin.ramp[0]};
  });
  const monthBar = months.length ? `<div class="months">${months.map(m=>`<span style="left:${m.left}px">${m.label}</span>`).join('')}</div>` : '';
  return `<div class="heat" style="gap:${colGap}px">
    ${showLabels?`<div class="labels">${months.length?'<span style="height:11px;margin-bottom:4px"></span>':''}${DAYS.map(d=>`<span style="height:${cell}px;line-height:${cell}px;margin-bottom:${gap}px">${d}</span>`).join('')}</div>`:''}
    <div class="col">${monthBar}<div class="cols" style="gap:${colGap}px">
      ${cols.map(c=>{
        const held = c.past && c.held;
        return `<div class="colw" style="gap:${gap}px;padding:${pad}px;${held?`background:${c.heat}30;border-color:${c.heat}cc`:''}">
          ${c.days.map(d=>{
            const sz = `width:${cell}px;height:${cell}px;`;
            if(d==='done') return `<span class="cell${c.today?' pulse':''}" style="${sz}background:${c.heat}"></span>`;
            if(d==='miss') return `<span class="cell miss" style="${sz}"></span>`;
            if(d==='future') return `<span class="cell future" style="${sz}"></span>`;
            return `<span class="cell nodata" style="${sz}"></span>`;
          }).join('')}
        </div>`;
      }).join('')}
    </div></div>
  </div>`;
}
function heatLegend(slot){
  const s = SKINS[slot];
  return `<div class="legend">
    <span><i style="background:${s.ramp[1]}"></i>séance faite</span>
    <span><i style="background:#20212c;box-shadow:inset 0 0 0 1px rgb(255 255 255/.13)"></i>attendu, pas fait</span>
    <span><i style="background:#20212c"></i>pas de donnée</span>
    <span><i style="background:#1b1c24;border:1px solid #262734"></i>à venir</span>
  </div>`;
}

/* — générateur de semaines pour la heatmap — */
function genWeeks(n, opts){
  const {density=0.72, futureFrom=null, missPattern=null} = opts||{};
  const out = [];
  for(let i=0;i<n;i++){
    const isFuture = futureFrom!==null && i>=futureFrom;
    const isCurrent = futureFrom!==null && i===futureFrom-1;
    const days = [];
    let done = 0;
    for(let d=0;d<7;d++){
      if(isFuture){ days.push('future'); continue; }
      const seed = Math.abs(Math.sin((i+1)*(d+3)*12.9898))%1;
      const expected = d===0||d===2||d===4;         // cadence 3×/semaine : L, M, V
      if(seed < density && expected){ days.push('done'); done++; }
      else if(expected){ days.push('miss'); }
      else { days.push('nodata'); }
    }
    if(isCurrent){ for(let d=5;d<7;d++) if(days[d]!=='done') days[d]='nodata'; }
    out.push({days, past: !isFuture && !isCurrent, held: done>=3, today:false, current:isCurrent});
  }
  if(missPattern) missPattern.forEach(i=>{ if(out[i]){ out[i].held=false; out[i].days=out[i].days.map(d=>d==='done'?'miss':d); } });
  return out;
}

/* — case à cocher de tâche — */
function cb(on, color, slot){
  return `<button class="cb ${on?'on':''}" style="${on?`background:${color};border-color:${color};color:#fff`:''}"
    onclick="togglecb(this,'${color}',${slot||'null'})">${ic('check','')}</button>`;
}
function togglecb(el, color, slot){
  const on = el.classList.toggle('on');
  el.style.background = on ? color : '';
  el.style.borderColor = on ? color : '';
  el.style.color = on ? '#fff' : '';
  el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
  const row = el.closest('.taskrow'); if(row) row.classList.toggle('done', on);
  /* la carte de l'objectif reprend vie — le mécanisme est une récompense,
     pas un reproche : il ne s'applique qu'aux objectifs à cadence */
  if(!slot) return;
  const frame = el.closest('.mobile, .desktop') || document;
  frame.querySelectorAll(`[data-objcard="${slot}"]`).forEach(card=>{
    if(on){
      card.classList.remove('dim','lit'); void card.offsetWidth; card.classList.add('lit');
      const ring = card.querySelector('[data-ringdone]');
      if(ring) ring.textContent = ring.dataset.ringdone;
    } else {
      card.classList.remove('lit'); card.classList.add('dim');
      const ring = card.querySelector('[data-ringdone]');
      if(ring) ring.textContent = ring.dataset.ringpending;
    }
  });
}

/* — ligne de tâche — */
function taskRow(t){
  const linked = !!t.accent;
  const style = linked ? `border-left-color:${t.accent};background-image:linear-gradient(90deg,${t.accent}0d,transparent 60%)` : '';
  return `<div class="taskrow ${linked?'linked':''} ${t.done?'done':''}" style="${style}">
    ${cb(!!t.done, t.accent||'#1a66ff', t.objSlot)}
    <div class="grow col" style="gap:2px">
      <div class="row" style="gap:7px">
        ${t.rec?`<span style="width:12px;height:12px;color:var(--ink-muted);display:block">${ic('repeat','')}</span>`:''}
        <span class="tt trunc">${t.title}</span>
      </div>
      <div class="row" style="gap:8px">
        ${t.list?`<span class="listpill"><i style="background:${t.listColor}"></i>${t.list}</span>`:''}
        ${t.meta?`<span class="tiny muted">${t.meta}</span>`:''}
      </div>
    </div>
    ${t.right?`<span class="tiny muted" style="flex:none">${t.right}</span>`:''}
  </div>`;
}

/* — carte objectif (dashboard / tâches) — */
function objCard(o, compact){
  const skin = SKINS[o.slot];
  const base = `background-image:${skin.grad};box-shadow:${skin.shadow}`;

  /* compact : tout sur une ligne, ~68 px — c'est la forme de l'app aujourd'hui.
     Empilée comme la carte pleine, elle faisait 100 px pour moitié moins d'info. */
  if(compact){
    let val;
    if(o.type==='quantite')    val = `<div style="text-align:right;flex:none">
      <div style="font-size:16px;font-weight:600">${o.valueLabel}</div>
      <div style="font-size:10px;color:rgb(255 255 255/.7);margin-top:1px">sur ${o.targetLabel}</div></div>`;
    else if(o.type==='jalons') val = `<div style="text-align:right;flex:none">
      <div style="font-size:16px;font-weight:600">${o.milestones.filter(x=>x.done).length} / ${o.milestones.length}</div>
      <div style="font-size:10px;color:rgb(255 255 255/.7);margin-top:1px">étapes</div></div>`;
    else                       val = ring(o.done, o.target, skin.core, 44);
    return `<div class="objcard ${o.dim?'dim':''}" data-objcard="${o.slot}"
      style="${base};flex-direction:row;align-items:center;gap:12px;padding:13px 15px;border-radius:var(--r-xl)">
      <div class="col grow" style="min-width:0;gap:2px">
        <div class="trunc" style="font-size:13.5px;font-weight:600">${o.title}</div>
        <div style="font-size:10.5px;color:rgb(255 255 255/.72)">${o.sub}</div>
      </div>${val}</div>`;
  }

  let viz;
  if(o.type==='quantite'){
    const pct = Math.round(o.value/o.target*100);
    viz = `<div class="grow col" style="gap:9px">
      <div class="between" style="align-items:baseline">
        <span style="font-size:21px;font-weight:600">${o.valueLabel}</span>
        <span style="font-size:11px;color:rgb(255 255 255/.72)">sur ${o.targetLabel}</span>
      </div>
      <div class="qbar" style="background:rgb(255 255 255/.22)"><i style="width:${pct}%;background:#fff"></i></div>
      <span style="font-size:10.5px;color:rgb(255 255 255/.72)">Relevé mensuel · dernier le 3 août</span>
    </div>`;
  } else if(o.type==='jalons'){
    viz = `<div class="grow col" style="gap:7px">
      ${o.milestones.map(ms=>`<div class="row" style="gap:9px">
        <span style="width:15px;height:15px;border-radius:5px;border:1px solid rgb(255 255 255/.55);
          ${ms.done?'background:rgb(255 255 255/.25);border-color:#fff':''};display:flex;align-items:center;justify-content:center">
          ${ms.done?`<span style="width:8px;height:8px;display:block">${ic('check','')}</span>`:''}</span>
        <span style="font-size:11.5px;${ms.done?'color:rgb(255 255 255/.6);text-decoration:line-through':''}">${ms.title}</span>
      </div>`).join('')}
    </div>`;
  } else {
    viz = `${ring(o.done, o.target, skin.core, 80)}
      <div class="col" style="gap:3px">
        <span style="font-size:11px;color:rgb(255 255 255/.78)">séances cette semaine</span>
        <span style="font-size:11px;color:rgb(255 255 255/.6)">${o.cumul}</span>
      </div>`;
  }

/* ============================================================
   FRISE ANNUELLE
   ============================================================ */
function frise(objs, opts){
  const {now=null, compact=false, overview=false} = opts||{};
  const LW = compact ? 112 : 226;
  const gap = compact ? 9 : 14;
  return `<div class="col" style="gap:${compact?9:12}px">
    <div class="row" style="gap:${gap}px"><span style="width:${LW}px;flex:none"></span>
      <div class="frisequarters grow"><i>T1</i><i>T2</i><i>T3</i><i>T4</i></div></div>
    <div class="frise" style="gap:${compact?7:9}px">
      ${objs.map(o=>{
        const skin = skinOf(o);
        const left = o.from/12*100, width = (o.to-o.from)/12*100;
        let bar;
        if(o.state==='future'){
          bar = `<div class="frisebar ghost" style="left:${left}%;width:${width}%"></div>`;
        } else if(o.state==='stopped'){
          /* le segment s'arrête à la date d'arrêt ; le reste de la fenêtre reste en pointillé,
             pour montrer ce qui était prévu sans le compter comme un échec */
          const stop = (o.stopAt-o.from)/12*100;
          bar = `<div class="frisebar ghost" style="left:${left+stop}%;width:${width-stop}%"></div>
            <div class="frisebar stopped" style="left:${left}%;width:${stop}%;background:${skin.grad};opacity:.55">
              ${overview ? '' : o.weeks.map(v=>`<i class="wk" style="background:${v===0?'rgb(0 0 0/.4)':`rgb(255 255 255/${0.16+v*0.27})`}"></i>`).join('')}
            </div>`;
        } else {
          /* fraction de la barre déjà vécue : au-delà, un voile assombrit le « pas encore »
             pour qu'il ne se confonde pas avec une semaine passée sans activité */
          const lived = now===null ? 1
            : Math.max(0, Math.min(1, (now - left) / width));
          const veil = lived < 1
            ? `<div style="position:absolute;top:0;bottom:0;left:${lived*100}%;right:0;background:rgb(20 21 28/.66)"></div>`
            : '';
          /* overview : segments pleins, sans le détail hebdomadaire — 52 semaines
             à 390 px ne se lisent pas, le détail se consulte par trimestre */
          bar = `<div class="frisebar ${o.state==='stopped'?'stopped':''}"
             style="left:${left}%;width:${width}%;background:${skin.grad};${o.state==='stopped'?'opacity:.5':''}">
            ${overview ? '' : o.weeks.map(v=>`<i class="wk" style="background:${v===0?'rgb(0 0 0/.4)':`rgb(255 255 255/${0.16+v*0.27})`}"></i>`).join('')}
            ${veil}</div>`;
        }
        return `<div class="friserow" style="gap:${gap}px${o.sec?';opacity:.72':''}">
          <div class="friselab" style="width:${LW}px;${compact?'font-size:10.5px;gap:6px':''}">
            <i style="background:${skin.hue};${o.sec?'width:5px;height:5px':''}"></i>
            <span class="trunc" style="${o.state==='stopped'?'color:#8a8d9e':''}">${o.title}</span>
            ${o.tag&&!compact?`<s>${o.tag}</s>`:''}</div>
          <div class="frisetrack" style="${o.sec?'height:14px':compact?'height:20px':''}">
            <div class="frisegrid">${Array.from({length:12},()=>'<i></i>').join('')}</div>
            ${bar}
            ${now!==null?`<div class="frisenow" style="left:${now}%"></div>`:''}
          </div>
        </div>`;
      }).join('')}
    </div>
    <div class="row" style="gap:${gap}px"><span style="width:${LW}px;flex:none"></span>
      <div class="frisemonths grow">${['J','F','M','A','M','J','J','A','S','O','N','D'].map(m=>`<i>${m}</i>`).join('')}</div></div>
  </div>`;
}

  background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-panel)">

/* Liste courte et plate : douze entrées se lisent d'un coup, les optgroups
   n'apportaient rien à cette échelle. Volontairement pas de « pages », « livres »,
   « mots » : l'unité n'est qu'un libellé d'affichage, pas une mesure, et ouvrir
   une taxonomie du décompte fabrique un vocabulaire que le produit n'a pas à tenir
   — « sans unité » couvre tous ces cas. Pas de « séances » non plus : c'est « fois ».
   « Autre… » reste la soupape, parce qu'une liste fermée ne peut pas tout prévoir
   et qu'une saisie libre seule est pire (chacun écrirait €, euros, EUR). */
const UNITS = ['€','$','kg','lb','km','mi','pas','h','min','fois'];
function unitSelect(selected){
  return `<span class="selectwrap">
    <select class="select" onchange="unitChange(this)">
      <option value=""${selected===''?' selected':''}>Sans unité</option>
      ${UNITS.map(u=>`<option${u===selected?' selected':''}>${u}</option>`).join('')}
      <option value="__autre">Autre…</option>
    </select><span class="chev">▾</span></span>`;
}
/* le suffixe des champs de valeur suit le select, il n'est jamais saisi à la main */
function unitChange(sel){
  const root = sel.closest('.mobile, .desktop') || document;
  const custom = root.querySelector('[data-customunit]');
  if(sel.value === '__autre'){
    if(custom){ custom.style.display = ''; custom.querySelector('input').focus(); }
    return;
  }
  if(custom) custom.style.display = 'none';
  root.querySelectorAll('[data-unit]').forEach(u => u.textContent = sel.value);
}
function customUnit(inp){
  const root = inp.closest('.mobile, .desktop') || document;
  root.querySelectorAll('[data-unit]').forEach(u => u.textContent = inp.value);
}
/* champ numérique dont l'unité est un suffixe fixe */
function numField(value, unit, style, fixed){
  return `<span class="unitfield" style="${style||'flex:1;min-width:0'}">
    <input class="input" value="${value}" />
    <span class="u"${fixed?'':' data-unit'}>${unit}</span></span>`;
}

/* stepper d'année : ◀ 2026 ▶, la flèche droite est bloquée sur l'année en cours */
function yearStep(y, maxY){
  return `<div class="ystep">
    <button class="yarr" aria-label="Année précédente">◀</button>
    <span class="yval">${y}</span>
    <button class="yarr" aria-label="Année suivante" ${y>=maxY?'disabled':''}>▶</button>
  </div>`;
}

/* les 13 semaines d'un objectif pour un trimestre donné, ou null s'il n'y était pas */
function weeksInQuarter(o, q){
  if(!o.weeks) return null;
  const qs = (q-1)*3, qe = q*3;
  if(o.to <= qs || o.from >= qe) return null;
  const off = Math.max(0, (q-1) - Math.floor(o.from/3));
  const w = o.weeks.slice(off*13, off*13+13);
  if(!w.length) return null;
  /* hors de la fenêtre de l'objectif : des cases vides, pas des cases étirées —
     sinon un objectif arrêté mi-février semble avoir couvert tout le trimestre */
  while(w.length < 13) w.push(null);
  return w;
}

/* frise détaillée d'un trimestre : 13 semaines lisibles, contrairement aux 52 écrasées */
function quarterFrise(objs, q, labelW, nowIdx){
  const MOIS = [['Jan','Fév','Mar'],['Avr','Mai','Juin'],['Juil','Août','Sep'],['Oct','Nov','Déc']][q-1];
  const n = nowIdx === undefined ? 13 : nowIdx;
  /* seuls les objectifs portés pendant ce trimestre : une piste vide n'apprend
     rien et fait croire à un objectif abandonné */
  const actifs = objs.filter(o => weeksInQuarter(o, q));
  if(!actifs.length) return `<p class="tiny" style="color:var(--ink-onnight);margin:0">
    Aucun objectif porté sur ce trimestre.</p>`;
  const rows = actifs.map(o=>{
    const w = weeksInQuarter(o, q);
    const skin = skinOf(o);
    /* intensité = activité de la semaine : plus c'est rempli, plus il y a eu de séances.
       Une semaine à venir est un contour, jamais un bloc sombre — sinon elle se lit
       comme une semaine ratée. */
    const cell = (v,i) => {
      if(v === null) return `<span style="flex:1"></span>`;
      if(i > n) return `<span style="flex:1;height:20px;border-radius:3px;border:1px dashed #2a2b38"></span>`;
      if(v === 0) return `<span style="flex:1;height:20px;border-radius:3px;background:#20212c"></span>`;
      return `<span style="flex:1;height:20px;border-radius:3px;background:${skin.core};
        opacity:${v>=3?1:v===2?.62:.34}"></span>`;
    };
    return `<div class="row" style="gap:10px;margin-bottom:7px">
      <div class="row" style="width:${labelW}px;flex:none;gap:7px;min-width:0">
        <span style="width:7px;height:7px;border-radius:50%;flex:none;background:${skin.hue}"></span>
        <span class="trunc" style="font-size:11px;color:#d5d6e0">${o.title}</span></div>
      <div class="row grow" style="gap:2px">
        ${w.map(cell).join('')}
      </div></div>`;
  }).join('');
  return `<div>${rows}
    <div class="row" style="gap:10px;margin-top:9px">
      <span style="width:${labelW}px;flex:none"></span>
      <div class="row grow" style="justify-content:space-around">
        ${MOIS.map(mo=>`<span style="font-size:9px;color:#5c5f70">${mo}</span>`).join('')}</div>
    </div></div>`;
}

function quarterPanel(objs, q, mode, current, nowQ, nowIdx, reviews, statsMap){
  const [t,meta,cta,disabled] = (reviews||QUARTER_REVIEW)[q];
  const stats = (statsMap||QUARTER_STATS)[q];
  const labelW = mode==='desktop' ? 150 : 110;
  /* combien de semaines du trimestre sont derrière nous */
  const n = nowQ == null ? 13 : q < nowQ ? 13 : q > nowQ ? -1 : nowIdx;
  const nbActifs = objs.filter(o => weeksInQuarter(o, q)).length;
  return `<div data-qpanel="${q}" style="display:${q===current?'':'none'}">
    <div class="night" style="padding:${mode==='desktop'?'20px 22px':'18px 14px'};margin-bottom:14px">
      <div class="between" style="margin-bottom:16px">
        <p class="seclabel on-night" style="margin:0">Semaine par semaine</p>
        <span class="tiny" style="color:var(--ink-onnight)">${nbActifs} objectif${nbActifs>1?'s':''} · 13 semaines</span></div>
      ${quarterFrise(objs, q, labelW, n)}
      ${n>=0 && n<13 ? `<p class="tiny" style="color:var(--ink-onnight);margin:12px 0 0">
        Les semaines en pointillé sont à venir.</p>` : ''}
    </div>
    <div class="nightbanner" style="margin-bottom:14px">
      <div class="grow" style="min-width:180px"><div class="t">${t}</div><div class="m">${meta}</div></div>
      <button class="btn btn-primary" style="flex:none" ${disabled?'disabled':''}>${cta}${disabled?'':' →'}</button>
    </div>

      ? `<div style="display:${mode==='desktop'?'grid':'flex'};${mode==='desktop'
          ?'grid-template-columns:repeat(3,1fr);gap:14px':'flex-direction:column;gap:10px'}">
          ${stats.map(([sl,ti,a,b])=>`<div class="card" style="box-shadow:none;border:1.5px solid var(--border);
            ${sl==='sec'?'opacity:.78':''}">
            <div class="row" style="gap:7px;margin-bottom:8px">
              <span style="width:7px;height:7px;border-radius:50%;background:${sl==='sec'?SEC_SKIN.hue:SKINS[sl].hue}"></span>

            <div style="font-size:19px;font-weight:600">${a}</div>

  </div>`;
}

/* la frise annuelle en mode « récit » : sur mobile, des segments pleins sans le
   détail hebdomadaire — 52 semaines à 390 px ne se lisent pas */
function anneeShell(mode, objs, opts){
  const {year=2026, maxYear=2026, now=62.5, current=3, pct=62, semaine='Semaine 33',
         meta=null, titre='Année'} = opts||{};
  const head = `<div class="between wrap" style="margin-bottom:18px">
    <h1 class="${mode==='desktop'?'h1':'h1-m'}">${titre}</h1>
    ${yearStep(year, maxYear)}</div>`;
  /* l'avancement de l'année est le repère principal du bandeau : gros chiffre à
     droite, comme YearProgressBar dans l'app. Pas de barre en plus — le trait
     orange de la frise marque déjà « aujourd'hui », la dédoubler serait du bruit. */
  const droite = pct != null
    ? `<div class="row" style="gap:0;align-items:baseline">
         <span style="font-size:${mode==='desktop'?26:22}px;font-weight:700;color:#fff;line-height:1">${pct}</span>
         <span style="font-size:13px;font-weight:700;color:#fff;margin-left:2px">%</span>
         <span style="font-size:11.5px;color:var(--ink-onnight);margin-left:5px">de l'année</span></div>`
    : `<span class="tiny" style="color:var(--ink-onnight)">${meta||''}</span>`;
  const annuelle = `<section class="night" style="padding:${mode==='desktop'?'24px 26px':'18px 14px'};margin-bottom:16px">
    <div class="between" style="margin-bottom:18px;align-items:baseline">
      <p class="seclabel on-night" style="margin:0">${year} · ${semaine}</p>
      ${droite}</div>
    ${frise(objs,{now, compact:mode==='mobile', overview:mode==='mobile'})}
  </section>`;
  const tabs = `<div class="seg" style="margin-bottom:14px;width:${mode==='desktop'?'auto':'100%'}">
    ${[1,2,3,4].map(q=>`<button style="${mode==='desktop'?'':'flex:1'}" aria-pressed="${q===current}"
      onclick="pickQuarter(this,${q})">T${q}${q===current?'':''}</button>`).join('')}
  </div>`;
  const nq = opts && opts.nowQ !== undefined ? opts.nowQ : 3;
  const panels = [1,2,3,4].map(q=>quarterPanel(objs, q, mode, current, nq, 6,
    opts&&opts.reviews, opts&&opts.stats)).join('');
  return shell(mode,'annee', head + annuelle + tabs + panels);
}
function pickQuarter(el, q){
  const root = el.closest('.mobile, .desktop') || document;
  [...el.parentNode.children].forEach(b=>b.setAttribute('aria-pressed','false'));
  el.setAttribute('aria-pressed','true');
  root.querySelectorAll('[data-qpanel]').forEach(p=>{
    p.style.display = p.dataset.qpanel === String(q) ? '' : 'none';
  });
}

/* courbe avec ses points de relevé : un seul graphique dit à la fois le montant
   et le rythme — un trou entre deux points, c'est un mois sans relevé */
function sparkline(points, color, w, h){
  const max = Math.max(...points);
  const xy = points.map((p,i)=>[i/(points.length-1)*w, h-(p/max)*h]);
  const d = xy.map(([x,y],i)=>`${i===0?'M':'L'}${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block;overflow:visible"
    preserveAspectRatio="none">
    <path d="${d} L${w},${h} L0,${h} Z" fill="${color}" opacity=".16"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"
      stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}
function sparkDots(points, color, w, h){
  const max = Math.max(...points);
  return points.map((p,i)=>`<span style="position:absolute;left:${(i/(points.length-1)*100).toFixed(1)}%;
    bottom:${((p/max)*100).toFixed(1)}%;width:8px;height:8px;border-radius:50%;background:${color};
    box-shadow:0 0 0 2.5px #14151d;transform:translate(-50%,50%)"></span>`).join('');
}

  </div>`;
  return bare(mode, box);
}

function tapday(el, color){
  const on = el.dataset.on === '1';
  el.dataset.on = on ? '0' : '1';
  el.style.background = on ? 'transparent' : color;
  el.style.borderColor = on ? '#2e3039' : color;
  el.style.color = on ? '#6f7385' : '#fff';
}
function dcarry(el){
  const on = el.textContent.trim().startsWith('✓');
  el.textContent = on ? '+ Emporter' : '✓ Emportée';
  el.style.borderColor = on ? '#2e3039' : '#2b5cff';
  el.style.background = on ? 'transparent' : 'rgb(43 92 255/.16)';
  el.style.color = on ? '#8b8e9e' : '#7ca0ff';
}

function pick(el){
  [...el.parentNode.children].forEach(c=>c.classList.remove('picked'));
  el.classList.add('picked');
}
function carry(el){
  const on = el.classList.toggle('on');
  el.innerHTML = on
    ? '<span style="width:11px;height:11px;display:block">' + ICONS.check + '</span>Emportée'
    : '+ Emporter';
  const all = [...el.closest('section').querySelectorAll('.carry')];
  const n = all.filter(x=>x.classList.contains('on')).length;
  const box = el.closest('section').parentNode.querySelector('[data-carrycount]');
  if(box){
    box.querySelector('[data-n]').textContent = n + (n>1?' tâches choisies':' tâche choisie');
    box.querySelector('[data-bar]').style.width = Math.min(100, n/6*100) + '%';
    box.querySelector('[data-over]').style.display = n>6 ? 'block' : 'none';
  }
}

   note:`<b>Le seul moment où l'on reparle des secondaires.</b> Ils sont absents du dashboard, du bandeau de la semaine et du rituel — ils réapparaissent ici, une fois par trimestre.

        ${[1,2,3].map(n=>`<button class="drk ${n===note?'on':''}" style="padding:4px 14px"

   note:`<b>L'acte qui justifie la cérémonie.</b> Clôturer un objectif trimestriel libère un slot : c'est le seul moment où la composition des trois objectifs change délibérément au lieu de dériver. Trois issues de poids égal — dont <b>laisser la place vide</b>, qui est une décision, pas un manque.`,
   render:m=>deck(m,{step:4,total:4,kicker:'T4 · 1er octobre → 31 décembre',

   render:m=>deck(m,{kicker:'2026 · terminée',

       <h1 class="dhead">objectifs menés au bout</h1>
       <p class="dsub" style="margin-bottom:30px">218 jours actifs · meilleure série : 11 semaines</p>
       <div style="width:100%;background:#12131a;border:1px solid #23252e;border-radius:16px;padding:16px">
         ${frise(FRISE_FIN,{compact:true})}
       </div>`,
     cta:'Préparer 2027 →', link:'Voir mon année en détail'})},

function pickrk(el){
  [...el.parentNode.children].forEach(c=>{
    c.classList.remove('on');
    c.querySelector('svg').setAttribute('fill','#3a3c46');
    c.querySelector('circle').setAttribute('fill','#24262f');
  });
  el.classList.add('on');
  el.querySelector('svg').setAttribute('fill','#f5a524');
  el.querySelector('circle').setAttribute('fill','#101116');
}
function pickopt(el){
  [...el.parentNode.querySelectorAll('.dcard')].forEach(c=>{
    c.style.borderColor = '#262833'; c.style.background = '#191b23';
  });
  el.style.borderColor = '#2b5cff'; el.style.background = 'rgb(43 92 255/.12)';
}


/* ============================================================
   NAVIGATION DE LA PLANCHE
   ============================================================ */
let cur = {screen:0, state:0, vp:'both'};
const $ = s => document.querySelector(s);

function renderTabs(){
  $('#screenTabs').innerHTML = SCREENS.map((s,i)=>
    `<button class="tab" role="tab" aria-selected="${i===cur.screen}" onclick="pickScreen(${i})">${s.label}</button>`).join('');
  $('#stateTabs').innerHTML = SCREENS[cur.screen].states.map((s,i)=>
    `<button class="tab" role="tab" aria-selected="${i===cur.state}" onclick="pickState(${i})">${s.label}</button>`).join('');
}
function pickScreen(i){ cur.screen=i; cur.state=0; syncHash(); render(); }
function pickState(i){ cur.state=i; syncHash(); render(); }

/* ancre d'URL : #ecran/etat/viewport — permet de pointer une maquette précise */
function syncHash(){
  const s = SCREENS[cur.screen], st = s.states[cur.state];
  history.replaceState(null,'', `#${s.id}/${st.id}${cur.vp!=='both'?'/'+cur.vp:''}`);
}
function readHash(){
  const [sid, stid, vp] = location.hash.replace(/^#/,'').split('/');
  const si = SCREENS.findIndex(s=>s.id===sid);
  if(si>=0){
    cur.screen = si;
    const ti = SCREENS[si].states.findIndex(s=>s.id===stid);
    cur.state = ti>=0 ? ti : 0;
  }
  if(vp==='mobile'||vp==='desktop'||vp==='both'){
    cur.vp = vp;
    [...document.querySelector('#vpToggle').children].forEach(x=>x.setAttribute('aria-pressed', x.dataset.vp===vp));
  }
}

function render(){
  renderTabs();
  const st = SCREENS[cur.screen].states[cur.state];
  $('#stateNote').innerHTML = st.note || '';
  const showM = cur.vp!=='desktop', showD = cur.vp!=='mobile';
  let html = '';
  if(showM) html += `<div class="frame-wrap"><p class="frame-cap">Mobile · 390 px</p>${st.render('mobile')}</div>`;
  if(showD) html += `<div class="frame-wrap"><p class="frame-cap">Desktop · 1280 px</p><div class="desktop-box" id="dbox">${st.render('desktop')}</div></div>`;
  $('#stage').innerHTML = html;
  scaleDesktop();
}
function scaleDesktop(){
  const box = $('#dbox'); if(!box) return;
  const frame = box.querySelector('.desktop');
  const avail = window.innerWidth - 44 - (cur.vp==='both' ? 390+34 : 0) - 20;
  const scale = Math.max(.34, Math.min(1, avail/1280));
  frame.style.transform = `scale(${scale})`;
  box.style.width = (1280*scale)+'px';
  box.style.height = (820*scale)+'px';
}
window.addEventListener('resize', scaleDesktop);

$('#vpToggle').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  cur.vp = b.dataset.vp;
  [...$('#vpToggle').children].forEach(x=>x.setAttribute('aria-pressed', x===b));
  syncHash(); render();
});
window.addEventListener('hashchange', ()=>{ readHash(); render(); });

readHash();
render();
</script>
