<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover : indispensable en mode installé sur iOS pour que
         env(safe-area-inset-*) renvoie autre chose que 0 (cf. MobileTopBar /
         MobileTabBar, qui s'appuient dessus pour dégager encoche et indicateur). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Clarity</title>
    <meta name="description" content="Vos tâches et vos objectifs, au même endroit." />
    <!-- Valeur unique : l'app n'a ni en-tête coloré ni dark mode. -->
    <meta name="theme-color" content="#f7f6f3" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignore le manifest : l'installation sur écran d'accueil se configure
         par ces balises. Le lien vers le manifest, lui, est injecté au build par
         vite-plugin-pwa — ne pas l'écrire ici, il y en aurait deux. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Clarity" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
